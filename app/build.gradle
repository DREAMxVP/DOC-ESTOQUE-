plugins {
    id 'com.android.application'
}

android {
    namespace 'com.docestoque.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.docestoque.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    flavorDimensions 'edition'
    productFlavors {
        full {
            dimension 'edition'
            buildConfigField 'boolean', 'PORTFOLIO_DEMO', 'false'
        }
        portfolio {
            dimension 'edition'
            applicationIdSuffix '.portfolio'
            versionNameSuffix '-portfolio'
            buildConfigField 'boolean', 'PORTFOLIO_DEMO', 'true'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
}
